cv:
  name: Sai Ganesh Veeravalli
  label: Doctoral Researcher
  email: saiganeshveeravalli@gmail.com
  location: Karlstad, Sweden
  image: ""
  summary: >
    Doctoral Candidate at Karlstad University working at the intersection of
    geospatial science, machine learning, and urban sustainability. Research
    focuses on mapping and modelling deprived urban areas across the Global South
    using open geospatial data and supervised learning.

  sections:
    Experience:
      - company: Karlstad University
        position: Doctoral Candidate
        location: Karlstad, Sweden
        url: https://www.kau.se/en
        logo: karlstad.png
        news_tag: kau-phd
        start_date: 2024-08-01
        end_date: present
        highlights:
          - "Conducting interdisciplinary research as part of the DEPRIMAP project, focusing on mapping and modelling deprived urban areas (DUAs) using geospatial data, morphometrics, and machine learning"
          - "Delivering lectures and practical sessions in geomatics, with a focus on UAV applications"
          - "Member of the CSR (Centre for Societal Risk Research) and CRS (Centre for Research on Sustainable Societal Transformation)"
          - "Core member of DynEO4SLUMS and SESAC projects"

      - company: National Centre for Coastal Research (NCCR), Ministry of Earth Sciences, Government of India
        position: Project Scientist I — Remote Sensing
        location: Chennai, India
        url: https://www.nccr.gov.in
        logo: nccr.png
        news_tag: nccr
        start_date: 2022-07-01
        end_date: 2024-07-01
        highlights:
          - "Development of pioneering shoreline management plans for key Indian states and UTs (Tamil Nadu, Andhra Pradesh, Kerala, Puducherry), leveraging advanced GIS and remote sensing techniques to inform policy and conservation efforts"
          - "Integral in synthesizing geodata, including demographic and environmental factors, to yield a holistic view of coastal dynamics"
          - "Pioneered UAV-based data acquisition, processing, and deep learning analysis, setting new standards for coastal environmental assessment. Piloted UAVs in different terrains ranging from coastal areas to rugged remote terrains like islands across coastal states and UTs, including Kerala, Tamil Nadu, Andhra Pradesh and Puducherry"
          - "Key member in the installation and processing of data for the Autonomous Beach Monitoring System (ABMS) at two key locations, a state-of-the-art high computing big data system for continuous monitoring of the coast"
          - "Crafted and disseminated comprehensive technical reports, shaping coastal management and protection policies"
          - "Engineered a bespoke field data collection app, optimizing the reporting of coastal structures and geomorphological features"
          - "Conducted extensive field surveys, managed interdisciplinary collaborations, and leveraged stakeholder insights to integrate socio-economic data into environmental planning, enhancing the relevance and impact of coastal management strategies"
          - "Authored and presented multiple impactful papers at national and international conferences and published research articles in international journals, underscoring the scientific community’s recognition of our cutting-edge research"

      - company: Wildlife Institute of India (WII)
        position: Project Associate I — GIS & Remote Sensing
        location: Dehradun, India
        url: https://www.wii.gov.in
        logo: wii.png
        news_tag: wii
        start_date: 2021-12-01
        end_date: 2022-07-01
        highlights:
          - "Collaborate with multidisciplinary subject matter experts in the field of Wildlife Research and Environmental Impact Assessment to generate study-specific models and analyses"
          - "Create high-resolution regional analysis combining field data, proprietary data and satellite imagery"
          - "Perform analysis and generate high-quality maps for the projects that include but are not limited to, human-wildlife conflict, species monitoring, road ecology, movement ecology, home-range modelling, habitat modelling,  environmental impact assessment, and mitigation assessment"
          - "UAV data collection and analysis for linear infrastructure projects and conservation priority landscapes"

      - company: Earthquakes and Megacities Initiative (EMI)
        position: Research Intern
        location: Quezon City, Philippines
        url: https://www.emi-megacities.org
        logo: emi.png
        start_date: 2019-11-01
        end_date: 2020-03-01
        highlights:
          - "Supporting the ongoing projects of EMI through its 'Global Internship Program"
          - "Developing the GIS for Urban Resilience Boot camp training modules, exercises, and workbook"
          - "Research and technical support for the development of EMI training programs, publications, promotional materials, and proposals"
          - "Developing marketing strategies to increase the reach of EMI across different social media platforms"
          - "App development using ESRI's suite - ArcGIS Pro, ArcGIS Online, Survery123, App studio for ArcGIS"

      - company: Water and Climate Lab, IIT Gandhinagar
        position: Summer Research Intern
        location: Gujarat, India
        url: https://vmishra.people.iitgn.ac.in/water&climate/index.html#/
        logo: wcl-iitgn.png
        start_date: 2017-05-01
        end_date: 2017-07-01
        highlights:
          - "Landsat imagery analysis for Urban Heat Island effects and vegetation-LST relationships across Indian cities"
          - "Supervised by Prof. Vimal Mishra"

    Volunteer:
      - company: Visakha Society for Protection and Care of Animals (VSPCA)
        position: GIS Project Manager / Secretary VSPCA USA
        location: Remote
        url: https://www.vspca.org
        logo: vspca.png
        start_date: 2019-08-01
        end_date: 2021-07-01
        highlights:
          - "Responsible for the organization's digital transformation as well as strategic planning for its digital presence and fundraising - Website, G suite, Social media platforms & other software"
          - "Building legacy of the organization through scientific articles, story maps, and documentaries about their successful coastal resilience and biodiversity projects"
          - "Worked on projects involving data collection, analysis, and visualization for the VSPCA's sea turtle conservation program, as well as mapping the organization's infrastructure"
          - "Developed digital infrastructure manuals / training materials for the established softwares and tools like WordPress, website hosting & management, Hootsuite, G Suite, social media and funding strategies"
          - "Training of interns - technical training, supervising, planning & scheduling the tasks & assignments"
          - "Other roles at VSPCA: Technical Advisory board memeber, Digital Infrastructure and GIS committee member"

